<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Magen Mill</title>

  <!-- Google Fonts Connection (Orbitron) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      min-height: 100vh;
    }

    /* Main page */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 45px 25px;
    }

    /* Logo */
    .logo {
      width: 250px;
      height: auto;
      margin-bottom: 15px;
      object-fit: contain;
    }

    /* All link sections */
    .links-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }

    /* Section Headers — Styled with a solid black box and white text */
    .section-header {
      font-size: 15px;
      line-height: 1.1;
      letter-spacing: 2px;
      font-weight: 500;
      text-transform: uppercase;
      color: #000000;
    }

    /* Individual sections */
    .link-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    /* Space wrapper around each link block block */
    .section-wrapper {
      width: 100%;
    }

    .section-wrapper + .section-wrapper {
      margin-top: 55px;
    }

    /* Main links base styling */
    .links a {
      text-decoration: none;
      font-size: 15px;
      line-height: 1.1;
      letter-spacing: 2px;
      font-weight: 500;
      text-transform: uppercase;
      display: inline-block;
      color: #000000;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .page {
        padding-top: 35px;
      }

      .logo {
        width: 115px;
        margin-bottom: 15px;
      }

      .section-header {
        font-size: 15px;
        margin-bottom: 15px;
        padding: 8px 10px;
      }

      .link-section {
        gap: 0px;
      }

      .section-wrapper + .section-wrapper {
        margin-top: 25px;
      }

      .links a {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- Website -->
  <main class="page">

    <!-- LOGO -->
    <img src="Logoo.svg" alt="Logo" class="logo">
    
    <div class="links-container">

      <!-- SECTION 1 WRAPPER -->
      <div class="section-wrapper">
        <!-- SUBHEADER 1 -->
        <h2 class="section-header">READ NOW</h2>
        
        <!-- SECTION 1 — 2 LINKS -->
        <div class="link-section links">
          <a href="https://example.com" target="_blank">
            MANGA Plus
          </a>
          <a href="https://example.com" target="_blank">
            Global Comix
          </a>
        </div>
      </div>

      <!-- SECTION 2 WRAPPER -->
      <div class="section-wrapper">
        <!-- SUBHEADER 2 -->
        <h2 class="section-header">FOLLOW ALONG</h2>

        <!-- SECTION 2 — 4 LINKS -->
        <div class="link-section links">
          <a href="https://example.com" target="_blank">
            Instagram
          </a>
          <a href="https://example.com" target="_blank">
            Youtube
          </a>
          <a href="https://example.com" target="_blank">
            X
          </a>
          <a href="https://example.com" target="_blank">
            TikTok
          </a>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
