<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Magen Mill</title>

  <!-- Google Fonts Connection (Orbitron) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      min-height: 100vh;
    }

    /* Main page */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 45px 25px;
    }

    /* Logo */
    .logo {
      width: 250px;
      height: auto;
      margin-bottom: 25px; /* Increased slightly for clear desktop breathing room */
      object-fit: contain;
      animation: spin 6s linear infinite;
    }

    /* All link sections */
    .links-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }

    /* Section Headers — Styled as a block with a black border and white background */
    .section-header {
      font-size: 15px;
      line-height: 1.1;
      letter-spacing: 2px;
      font-weight: 500;
      text-transform: uppercase;
      color: #000000;
      
      /* Block styling additions */
      display: inline-block;        /* Keeps the block tight around the text */
      background-color: #ffffff;    /* White inside */
      border: 1.5px solid #000000;    /* Black outline */
      padding: 5px 10px;           /* Breathing room inside the block */
      margin-bottom: 25px;          /* Pushes down the links below it */
    }

    /* Individual sections */
    .link-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px; /* Slightly wider layout gap for easier mobile tapping */
      width: 100%;
    }

    /* Space wrapper around each link block block */
    .section-wrapper {
      width: 100%;
    }

    .section-wrapper + .section-wrapper {
      margin-top: 55px;
    }

    /* Main links base styling */
    .links a {
      text-decoration: none;
      font-size: 15px;
      line-height: 1.1;
      letter-spacing: 2px;
      font-weight: 500;
      text-transform: uppercase;
      display: inline-block;
      color: #000000;
      cursor: pointer;
    }

    /* Responsive adjustments for phones/tablets */
    @media (max-width: 600px) {
      .page {
        padding: 40px 20px; /* Uniform desktop-like boundary */
      }

      .logo {
        width: 180px; /* Keeps the logo prominent instead of shrinking to 115px */
        margin-bottom: 30px;
      }

      .section-header {
        font-size: 14px;
        margin-bottom: 20px;
        padding: 6px 12px; 
      }

      .link-section {
        gap: 16px; /* FIXED: Restored spacing between links so they match the desktop aesthetic */
      }

      .section-wrapper + .section-wrapper {
        margin-top: 45px; /* Kept block sections perfectly spaced without crowding */
      }

      .links a {
        font-size: 14px;
      }
    }

    /* Spin animation definition */
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- Website -->
  <main class="page">

    <!-- LOGO -->
    <img src="Logoo.svg" alt="Logo" class="logo">
    
    <div class="links-container">

      <!-- SECTION 1 WRAPPER -->
      <div class="section-wrapper">
        <!-- SUBHEADER 1 -->
        <h2 class="section-header">READ NOW</h2>
        
        <!-- SECTION 1 — 2 LINKS -->
        <div class="link-section links">
          <a href="https://example.com" target="_blank">
            MANGA Plus
          </a>
          <a href="https://example.com" target="_blank">
            Global Comix
          </a>
        </div>
      </div>

      <!-- SECTION 2 WRAPPER -->
      <div class="section-wrapper">
        <!-- SUBHEADER 2 -->
        <h2 class="section-header">FOLLOW ALONG</h2>

        <!-- SECTION 2 — 4 LINKS -->
        <div class="link-section links">
          <a href="https://example.com" target="_blank">
            Instagram
          </a>
          <a href="https://example.com" target="_blank">
            Youtube
          </a>
          <a href="https://example.com" target="_blank">
            X
          </a>
          <a href="https://example.com" target="_blank">
            TikTok
          </a>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
